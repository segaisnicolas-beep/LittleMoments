<html lang="en">
<head>

<style>
:root{--acard:#EAF6F0;--bg:#D9EEE3;--card:#EAF6F0;--ink:#1E2535;--mute:#5A6B63;--line:#BFDCCE;--acc:#1C7C5E;--accink:#fff;--hi:#F4B740;--danger:#C2410C;--note:#FFF3C4;--noteln:#EBD98A;--r:16px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--acard:var(--card);--note:#3B3420;--noteln:#5A4E2A;--bg:#0A1A16;--card:#142A24;--ink:#EEF1F7;--mute:#9AB0A8;--line:#244038;--acc:#3DBE96;--accink:#08241B;--danger:#FB923C;color-scheme:dark}}
:root[data-theme="dark"]{--acard:var(--card);--note:#3B3420;--noteln:#5A4E2A;--bg:#0A1A16;--card:#142A24;--ink:#EEF1F7;--mute:#9AB0A8;--line:#244038;--acc:#3DBE96;--accink:#08241B;--danger:#FB923C;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="midnight"]{--acard:var(--card);--bg:#070B1C;--card:#141C3A;--ink:#EAEFFF;--mute:#93A0C4;--line:#232E5A;--acc:#7C9CFF;--accink:#0B1230;--hi:#F4B740;--danger:#FB923C;--note:#2E2B4A;--noteln:#4B4777;color-scheme:dark}
:root[data-theme="ocean"]{--acard:#E3F0FB;--bg:#CFE4F7;--card:#E3F0FB;--ink:#12263A;--mute:#52697F;--line:#B2CFE8;--acc:#1A6FB5;--accink:#fff;--hi:#FFC857;--danger:#C2410C;--note:#F0F8FF;--noteln:#B7D6EE;color-scheme:light}
:root[data-theme="rose"]{--acard:#FDEBF1;--bg:#F9D9E4;--card:#FDEBF1;--ink:#3A1F2B;--mute:#7F5A69;--line:#EDBDCE;--acc:#D6477A;--accink:#fff;--hi:#FFC857;--danger:#C2410C;--note:#FFF2F5;--noteln:#F2BFCD;color-scheme:light}
:root[data-theme="lavender"]{--acard:#F0EBFC;--bg:#E4DBF8;--card:#F0EBFC;--ink:#27214A;--mute:#65608A;--line:#CDC1EC;--acc:#6D4FC2;--accink:#fff;--hi:#F4B740;--danger:#C2410C;--note:#F6F2FF;--noteln:#CFC4EE;color-scheme:light}
:root[data-theme="sun"]{--acard:#FFF0DC;--bg:#FFE6C7;--card:#FFF0DC;--ink:#3A2410;--mute:#7F634A;--line:#EFCDA0;--acc:#D9650F;--accink:#fff;--hi:#F4B740;--danger:#B91C1C;--note:#FFF8E0;--noteln:#EBD08A;color-scheme:light}
.hrt{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);color:#FF4D6D;display:flex;align-items:center;justify-content:center;font-size:calc(15px*var(--fs,1));line-height:1;pointer-events:none}

.panel .crow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;font-weight:700}
.panel input[type=color]{width:56px;height:36px;padding:2px;margin:0;border-radius:10px;cursor:pointer;flex:none}
.crows{margin:8px 0 12px}
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0 4px}
.tbtn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);font-size:calc(15px*var(--fs,1));cursor:pointer;text-align:left}
.tbtn.on{border-color:var(--acc)}
.sw{display:flex;padding-right:6px}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);margin-right:-6px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(16px*var(--fs,1))/1.4 var(--font,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif);padding-bottom:130px}
#main{max-width:none;margin:0 auto;padding:0 12px}
#main .grid{margin-left:-12px;margin-right:-12px}
header{position:relative;padding:20px 4px 8px 4px}
.gbtn.sbtn{right:60px}
h1{font-size:calc(30px*var(--fs,1));font-weight:800;margin:0;letter-spacing:-.02em;color:var(--acc)}
header p{margin:2px 0 0;color:var(--mute)}
h2{font-size:calc(19px*var(--fs,1));font-weight:800;margin:0}
.mh h2{color:var(--acc)}
h3{margin:0 0 8px;font-size:calc(18px*var(--fs,1))}
.mh{display:flex;justify-content:space-between;align-items:baseline;padding:22px 4px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.albums+.grid{margin-top:14px}
.acard .row{margin-top:6px}
.acard .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(var(--pc,3),1fr);gap:0}
@media(min-width:560px){.grid{grid-template-columns:repeat(var(--pc,4),1fr)}}
.ph{position:relative;aspect-ratio:1;border-radius:var(--pr,10px);overflow:hidden;background:var(--line)}

.ph{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

.dng{color:var(--danger)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:10px 16px;font-weight:800;font-size:calc(15px*var(--fs,1));cursor:pointer}
.btn.dng{background:var(--danger);color:#fff}
.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.4}
.mt{margin-top:10px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
.hd .lnk{margin-top:14px}
.lb{display:block;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:calc(14px*var(--fs,1));font-weight:700;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.hint{margin:0 4px 4px;color:var(--mute);font-size:calc(14px*var(--fs,1))}
.pk{background:var(--hi);color:#2A1D00;padding:8px 12px;border-radius:12px;font-weight:700}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:max-content;max-width:calc(100% - 24px);background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.22);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;padding:6px}
#bar.sel{left:12px;right:12px;transform:none;width:auto;max-width:none;border-radius:22px;padding:8px 10px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:6px}
.sbr{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-weight:800;font-size:calc(14px*var(--fs,1))}
.sbr .lnk{padding:2px 4px}
.sba{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.sba .btn{padding:11px 4px;border-radius:14px;font-size:calc(14px*var(--fs,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#bar:empty{display:none}
.tab{background:none;border:0;border-radius:999px;font-weight:800;font-size:calc(15px*var(--fs,1));color:var(--mute);padding:10px 24px;cursor:pointer;transition:background .15s,color .15s}
.tab.on{background:var(--acc);color:var(--accink)}
.add{background:var(--hi);color:#2A1D00;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer}
.albums{display:grid;grid-template-columns:repeat(var(--ac,2),1fr);gap:0;padding-top:8px}
.acard{background:var(--acard,var(--card));border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:calc(16px*var(--fs,1))}
.acard img,.noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--pr,10px);background:var(--line);margin-bottom:4px}
:root[data-corners="square"]{--r:0px;--pr:0px}
.acard span,.mute{color:var(--mute);font-size:calc(14px*var(--fs,1))}
.acard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ph.doc{background:var(--note);border:1px solid var(--noteln)}
.dt{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;color:var(--ink);text-align:left;padding:10px 10px 26px;overflow:hidden;cursor:pointer;font-size:calc(13px*var(--fs,1));line-height:1.3}
.dt b{font-size:calc(14px*var(--fs,1));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dt span{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;opacity:.8}
.ph.doc.on .dt{opacity:.7;padding-top:40px}
.dlb{position:absolute;left:10px;bottom:7px;font-size:calc(11px*var(--fs,1));font-weight:800;color:var(--mute);pointer-events:none}
.dhd{display:flex;justify-content:space-between;align-items:center}
.dhd h3{margin:0}
.panel textarea{width:100%;font:inherit;font-size:calc(16px*var(--fs,1));line-height:1.5;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:6px;min-height:40vh;resize:vertical}
.empty{padding:48px 16px;text-align:center;color:var(--mute)}
.empty h2{color:var(--ink);margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:calc(14px*var(--fs,1));max-width:90%;text-align:center}
#toast:empty{display:none}
#err{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;background:var(--danger);color:#fff;border-radius:12px;padding:10px 14px;font-size:calc(14px*var(--fs,1))}
#err[hidden]{display:none}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:11;width:52px;height:52px;border-radius:16px;border:0;background:var(--acc);color:var(--accink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
#fab[hidden]{display:none}
#fab{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root[data-fab="bl"] #fab,:root[data-fab="bl"] #done{right:auto;left:16px}
:root[data-fab="tr"] #fab,:root[data-fab="tr"] #done{bottom:auto;top:calc(72px + env(safe-area-inset-top,0px))}
:root[data-fab="tl"] #fab,:root[data-fab="tl"] #done{right:auto;left:16px;bottom:auto;top:calc(72px + env(safe-area-inset-top,0px))}
#done{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:11;height:52px;padding:0 20px;border-radius:16px;border:0;background:var(--acc);color:var(--accink);font-weight:800;font-size:calc(16px*var(--fs,1));display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer}
#done[hidden]{display:none}
#pop{position:fixed;inset:0;z-index:15}
#pop[hidden]{display:none}
.pback{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.pmenu{position:absolute;right:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.pmenu .item{padding:14px 4px}
.pmenu .item:last-child{border-bottom:0}
#pop.top .pmenu{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto}
:root[data-fab="bl"] #pop:not(.top) .pmenu{right:auto;left:16px}
:root[data-fab="tr"] #pop:not(.top) .pmenu{bottom:auto;top:calc(136px + env(safe-area-inset-top,0px))}
:root[data-fab="tl"] #pop:not(.top) .pmenu{right:auto;left:16px;bottom:auto;top:calc(136px + env(safe-area-inset-top,0px))}
.gbtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:12px;z-index:12;box-shadow:0 2px 8px rgba(0,0,0,.18);width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pmenu .dng{color:var(--danger)}
.back{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.panel{position:relative;width:100%;max-width:720px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.panel input{width:100%;font-size:calc(16px*var(--fs,1));padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:6px}
.panel label{display:block;margin-top:14px;font-weight:700}
.vw{position:absolute;inset:0;background:#000;overflow:hidden;touch-action:none}
.trk{position:absolute;top:0;bottom:0;left:-100%;width:300%;display:flex;will-change:transform}
.sl{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.vimg{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;will-change:transform}
.vimg.zt{transition:transform .2s ease}
.vx,.vn,.vf{position:absolute;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:calc(24px*var(--fs,1));line-height:1;cursor:pointer}
.vx{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
.vf{top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:2}
.vn{top:50%;transform:translateY(-50%)}
.vn.l{left:8px}
.vn.r{right:8px}
.vcap{position:absolute;left:0;right:0;bottom:0;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center;font-size:calc(14px*var(--fs,1));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.ntw{display:block;width:fit-content;max-width:100%;margin:0 auto 8px;background:rgba(70,70,70,.72);border-radius:12px;padding:8px 12px}
.nt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(15px*var(--fs,1));white-space:pre-wrap}
.nbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:calc(14px*var(--fs,1));cursor:pointer;margin:4px 0 6px}
.ned{position:absolute;left:0;right:0;top:0;z-index:3;background:var(--card);color:var(--ink);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;border-radius:0 0 20px 20px}
.ned textarea{width:100%;font-size:calc(16px*var(--fs,1));padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);resize:none}
.nb{position:absolute;right:6px;bottom:6px;background:#1E2535;border:2px solid #fff;color:#fff;border-radius:999px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:calc(12px*var(--fs,1));pointer-events:none}
.item{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;font-size:calc(16px*var(--fs,1));color:inherit;cursor:pointer;text-align:left}
.sec{margin:18px 4px 2px;font-size:calc(13px*var(--fs,1));font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.shd{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;color:var(--ink);font-weight:800;font-size:calc(16px*var(--fs,1));cursor:pointer;text-align:left}
.shd .chev{font-size:calc(22px*var(--fs,1));line-height:1;color:var(--mute);transition:transform .15s}
.sbody{padding:0 0 4px 12px;border-bottom:1px solid var(--line)}
.sbody .item:last-child{border-bottom:0}
.mic{margin-top:6px}.mic.on{color:var(--danger)}
.pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;padding-left:3px;pointer-events:none}
:root[data-alist] .albums{grid-template-columns:1fr;gap:8px}
:root[data-alist] .acard img,:root[data-alist] .acard .noimg{display:none}
:root[data-alist] .acard{flex-direction:row;justify-content:space-between;align-items:center;gap:12px;padding:16px 14px}
:root[data-alist] .acard b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root[data-alist] .acard span{flex:0 0 auto;text-align:right}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lock[hidden]{display:none}
#lock h2{margin:0;font-size:calc(22px*var(--fs,1))}
#lock .dots{display:flex;gap:14px;margin:6px 0 2px}
#lock .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);display:block}
#lock .dots i.on{background:var(--ink)}
#lock .pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:8px}
#lock .pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:26px;font-weight:600;cursor:pointer}
#lock .msg{min-height:1.4em;margin:0;color:var(--danger)}
#lock p.mute{max-width:340px;margin:0}
.mem{margin:4px 0 12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.memh{display:flex;align-items:center;justify-content:space-between}
.memh b{font-size:calc(16px*var(--fs,1))}
.memg{margin-top:8px}
.memg p{margin:0 0 4px;font-size:calc(13px*var(--fs,1));color:var(--mute)}
.mems{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.mems img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:0 0 auto;cursor:pointer}
#ss{position:fixed;inset:0;z-index:55;background:#000;color:#fff;overflow:hidden;touch-action:manipulation;user-select:none}
#ss[hidden]{display:none}
#ss .stage{position:absolute;inset:0}
#ss .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .9s ease}
#ss .sl.on{opacity:1}
#ss .sl img{max-width:100%;max-height:100%;object-fit:contain;animation:ssz var(--d,6s) ease-out forwards}
@keyframes ssz{from{transform:scale(1)}to{transform:scale(1.06)}}
#ss .ctl,#ss .bot{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:opacity .3s}

<script>
const $=s=>document.querySelector(s);
const M=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const monthLabel=t=>{const d=new Date(t);return M[d.getMonth()]+" "+d.getFullYear()};
const dayLabel=t=>{const d=new Date(t);return d.getDate()+" "+M[d.getMonth()]+" "+d.getFullYear()};
let groupBy="month",favOnly=false;
try{const s=localStorage.getItem("pm-group");if(s==="day"||s==="year")groupBy=s}catch(_){}

const FAVI={heart:{n:"Cœur",f:"♥",o:"♡",c:"#FF4D6D"},star:{n:"Étoile",f:"★",o:"☆",c:"#FFC83D"},flower:{n:"Fleur",f:"✿",o:"❀",c:"#FF8AD8"}};

let favOn=true;
try{if(localStorage.getItem("pm-favs")==="0")favOn=false}catch(_){}

  favOn=!favOn;

}
async function toggleFav(){

    if(persist&&!(await patch("photos",p.id,r=>{if(on)r.fav=true;else delete r.fav})))throw new Error("Photo introuvable");

}

  setTimeout(()=>toast(""),3000);

const emptyA=(its0,t,s)=>favOnly&&its0.length?empty("Aucun favori dans cet album",T5("Touchez « "+FI().f+" Favoris » pour tout afficher.","Tap “"+FI().f+" Favorites” to show everything.","Toca «"+FI().f+" Favoritos» para mostrar todo.","Tippe auf „"+FI().f+" Favoriten“, um alles anzuzeigen.","Tocca «"+FI().f+" Preferiti» per mostrare tutto.")):empty(t,s);
const plural=(n,w)=>{const p=lang!=="fr"&&PL[w];return n+" "+(p?p[LI][n>1?1:0]:w+(n>1?"s":""))};
const toast=m=>{$("#toast").textContent=m};
let photos=[],albums=[],view="time",sel=new Set(),urls=new Map(),persist=true,pend=[],picking=false,pickName="",pickTo="",shown=[],vi=0,tx0=null,busy=false,cv="",reorder=false,zs=1,zx=0,zy=0,pn=null,pan=null,lastTap=0,lastTouch=0,md=null,dl=null;
const url=p=>{if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)};

/* Stockage sur l’appareil (IndexedDB) */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("petits-moments",3);r.onupgradeneeded=()=>{const d=r.result;for(const s of ["photos","albums"])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"});if(!d.objectStoreNames.contains("trash"))d.createObjectStore("trash",{keyPath:"tid"});if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"id"})};r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>d.close();res(d)};r.onerror=()=>rej(r.error)});

/* Échec d’enregistrement : on prévient toujours l’utilisateur (au plus un message toutes les 8 s) */
let sfLast=0;

  const n=Date.now();if(n-sfLast<8000)return;sfLast=n;
  const full=!!e&&e.name==="QuotaExceededError";
  toast(full
    ?T5("Stockage plein : tes dernières modifications n’ont pas pu être enregistrées. Libère de la place ou supprime des photos.","Storage full: your latest changes couldn’t be saved. Free up space or delete some photos.","Almacenamiento lleno: no se pudieron guardar tus últimos cambios. Libera espacio o elimina fotos.","Speicher voll: Deine letzten Änderungen konnten nicht gespeichert werden. Schaffe Platz oder lösche Fotos.","Spazio esaurito: le ultime modifiche non sono state salvate. Libera spazio o elimina delle foto.")
    :T5("L’enregistrement a échoué : tes dernières modifications risquent de ne pas être conservées. Réessaie.","Saving failed: your latest changes may not be kept. Please try again.","Error al guardar: tus últimos cambios podrían perderse. Inténtalo de nuevo.","Speichern fehlgeschlagen: Deine letzten Änderungen gehen eventuell verloren. Versuche es erneut.","Salvataggio non riuscito: le ultime modifiche potrebbero andare perse. Riprova."));
  setTimeout(()=>toast(""),7000);
}
const tx=(s,m,f)=>txRaw(s,m,f).catch(e=>{if(m==="readwrite")storeFail(e);throw e});

/* Espace utilisé sur l’appareil */
let stTxt="",stWarned=false;
const fmtB=n=>{const g=n>=1e9,v=g?n/1e9:n/1e6,u=g?T5("Go","GB","GB","GB","GB"):T5("Mo","MB","MB","MB","MB");let t;try{t=v.toLocaleString(lang,{maximumFractionDigits:1})}catch(_){t=v.toFixed(1)}return t+" "+u};
/* Texte alternatif des photos (lecteurs d’écran) : la date, et « vidéo » si besoin */
const photoAlt=p=>{let t="";try{t=dayLabel(p.date)||""}catch(_){}if(p.vid)return(t?t+", ":"")+T5("vidéo","video","vídeo","Video","video");return t||T5("Photo","Photo","Foto","Foto","Foto")};
async function storageRefresh(){
  try{
    if(!(navigator.storage&&navigator.storage.estimate))return;
    const {usage,quota}=await navigator.storage.estimate();
    if(!quota||usage==null)return;
    stTxt=fmtB(usage)+" / "+fmtB(quota);
    const el=$("#stval");if(el)el.textContent=stTxt;
    if(usage/quota>=0.85&&!stWarned){
      stWarned=true;
      toast(T5("Le stockage est presque plein. Pense à faire une sauvegarde et à libérer de la place.","Storage is almost full. Consider making a backup and freeing up space.","El almacenamiento está casi lleno. Haz una copia y libera espacio.","Der Speicher ist fast voll. Erstelle eine Sicherung und schaffe Platz.","Lo spazio è quasi esaurito. Fai un backup e libera spazio."));
      setTimeout(()=>toast(""),7000);
    }
  }catch(_){}
}
const all=s=>tx(s,"readonly",o=>o.getAll());

}

/* Date de prise de vue (EXIF), sinon date du fichier */
async function exifDate(file){
  try{
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o),len=v.getUint16(o+2);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949;
        const g16=p=>v.getUint16(t+p,le),g32=p=>v.getUint32(t+p,le);
        const find=(p,want)=>{const n=g16(p);for(let i=0;i<n;i++){const e=p+2+i*12;if(g16(e)===want)return e}return null};
        const ifd0=g32(4),ex=find(ifd0,0x8769);
        let e=ex?find(g32(ex+8),0x9003):null;
        if(!e)e=find(ifd0,0x0132);
        if(!e)return null;
        let s="";const off=g32(e+8);
        for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(t+off+i));
        const q=s.match(/(\d+):(\d+):(\d+) (\d+):(\d+):(\d+)/);
        return q?new Date(+q[1],q[2]-1,+q[3],+q[4],+q[5],+q[6]).getTime():null;
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}

/* Défilement dans la visionneuse */
document.addEventListener("touchstart",e=>{
  if(busy||!e.target.closest(".vw")||e.target.closest("button")){tx0=null;return}
  if(e.touches.length===2){tx0=null;pan=null;pn={d:tdist(e),s:zs};const g=$("#trk");g.style.transition="none";g.style.transform="";return}
  if(zs>1){pan={x:e.touches[0].clientX,y:e.touches[0].clientY,zx,zy,t:Date.now(),moved:false};tx0=null;return}
  tx0=[e.touches[0].clientX,e.touches[0].clientY,Date.now()];
  $("#trk").style.transition="none";
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(pn&&e.touches.length===2){
    const m=focal((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);
    zoomTo(pn.s*tdist(e)/pn.d,m[0],m[1]);
    return;
  }
  if(pan&&e.touches.length===1){
    const dx=e.touches[0].clientX-pan.x,dy=e.touches[0].clientY-pan.y;
    if(Math.abs(dx)+Math.abs(dy)>8)pan.moved=true;
    zx=pan.zx+dx;zy=pan.zy+dy;zapply();
    return;
  }
  if(!tx0)return;
  let dx=e.touches[0].clientX-tx0[0];
  if((dx>0&&vi<=0)||(dx<0&&vi>=shown.length-1))dx*=.3;
  $("#trk").style.transform=`translateX(${dx}px)`;
},{passive:true});
document.addEventListener("touchend",e=>{
  lastTouch=Date.now();
  if(pn){if(e.touches.length<2){pn=null;if(zs<1.05)zreset(true)}pan=null;tx0=null;return}
  if(pan){const tap=!pan.moved&&Date.now()-pan.t<250;pan=null;if(tap)tapped(e);return}
  if(!tx0)return;
  const dx=e.changedTouches[0].clientX-tx0[0],dy=e.changedTouches[0].clientY-tx0[1],dt=Date.now()-tx0[2],W=$(".vw").clientWidth;
  tx0=null;
  if(Math.abs(dx)<10&&Math.abs(dy)<10&&dt<250&&tapped(e)){go(0);return}
  if(Math.abs(dx)>Math.max(50,W*.2)||(Math.abs(dx)>30&&Math.abs(dx)/dt>.4))go(dx<0?1:-1);
  else go(0);
});
/* Zoom */
const zimg=()=>$("#trk .sl:nth-child(2) img");
const tdist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
const focal=(x,y)=>{const r=$(".vw").getBoundingClientRect();return [x-r.left-r.width/2,y-r.top-r.height/2]};
function zapply(anim){
  const im=zimg(),v=$(".vw");
  if(!im||!v)return;
  const mx=Math.max(0,(im.clientWidth*zs-v.clientWidth)/2),my=Math.max(0,(im.clientHeight*zs-v.clientHeight)/2);
  zx=Math.min(mx,Math.max(-mx,zx));zy=Math.min(my,Math.max(-my,zy));
  im.classList.toggle("zt",!!anim);
  im.style.transform=zs>1?`translate(${zx}px,${zy}px) scale(${zs})`:"";
}
function zreset(anim){zs=1;zx=0;zy=0;zapply(anim)}
function zoomTo(s,fx,fy,anim){
  s=Math.min(5,Math.max(1,s));
  const k=s/zs;
  zx=fx-(fx-zx)*k;zy=fy-(fy-zy)*k;zs=s;
  if(zs===1){zx=0;zy=0}
  zapply(anim);
}
function tapped(e){
  const t=e.changedTouches[0],n=Date.now();
  if(n-lastTap<300){
    lastTap=0;
    if(zs>1)zreset(true);else{const f=focal(t.clientX,t.clientY);zoomTo(2.5,f[0],f[1],true)}
    return true;
  }
  lastTap=n;
  return false;
}
document.addEventListener("wheel",e=>{
  if(!e.target.closest(".vw"))return;
  e.preventDefault();
  const f=focal(e.clientX,e.clientY);
  zoomTo(zs*(e.deltaY<0?1.2:1/1.2),f[0],f[1]);
},{passive:false});
document.addEventListener("dblclick",e=>{
  if(Date.now()-lastTouch<700||!e.target.closest(".vw")||e.target.closest("button"))return;
  const f=focal(e.clientX,e.clientY);
  if(zs>1)zreset(true);else zoomTo(2.5,f[0],f[1],true);
});
document.addEventListener("mousedown",e=>{if(zs>1&&e.target.closest(".vw")&&!e.target.closest("button"))md={x:e.clientX,y:e.clientY,zx,zy}});
document.addEventListener("mousemove",e=>{if(md){zx=md.zx+e.clientX-md.x;zy=md.zy+e.clientY-md.y;zapply()}});
document.addEventListener("mouseup",()=>{md=null});

function nameDate(name){

    const d=new Date(+m[1],+m[2]-1,+m[3],m[4]?+m[4]:12,m[5]?+m[5]:0,m[6]?+m[6]:0);
    if(d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]&&d.getTime()<Date.now()+864e5)return d.getTime();
  }

  if(m){const t=+m[1];if(t>9.5e11&&t<Date.now()+864e5)return t}

}
async function vidDate(f){
  try{
    let o=0;

      const h=new DataView(await f.slice(o,o+16).arrayBuffer());
      if(h.byteLength<8)break;
      let size=h.getUint32(0);const type=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
      let hdr=8;
      if(size===1&&h.byteLength>=16){size=h.getUint32(8)*4294967296+h.getUint32(12);hdr=16}else if(size===0)size=f.size-o;
      if(type==="moov"){
        const m=new DataView(await f.slice(o+hdr,o+hdr+160).arrayBuffer());
        if(String.fromCharCode(m.getUint8(4),m.getUint8(5),m.getUint8(6),m.getUint8(7))!=="mvhd")return null;
        const secs=m.getUint8(8)===1?m.getUint32(12)*4294967296+m.getUint32(16):m.getUint32(12),t=(secs-2082844800)*1000;
        return t>9e11&&t<Date.now()+864e5?t:null;

}

function ssSynth(){
  try{
    const C=window.AudioContext||window.webkitAudioContext,ctx=ss.ctx||(ss.ctx=new C());

    const ch=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],beat=60/66,pat=[0,1,2,1,0,1,2,1];

/* Idées d’albums : photos sans album prises à des dates proches */
const SUG_GAP=864e5,SUG_SPAN=7*864e5,SUG_MIN=5;
let sugT=[];
const sugOn=()=>{try{return localStorage.getItem("pm-sug")!=="0"}catch(_){return true}};
const sugDis=()=>{try{const a=JSON.parse(localStorage.getItem("pm-sugx")||"[]");return Array.isArray(a)?a:[]}catch(_){return []}};
function sugList(){
  const inA=new Set();for(const a of albums)for(const i of a.ids)inA.add(i);
  const free=photos.filter(p=>!inA.has(p.id)).sort((x,y)=>x.date-y.date),out=[];let cur=[];
  const flush=()=>{if(cur.length>=SUG_MIN)out.push(cur);cur=[]};
  for(const p of free){if(cur.length&&(p.date-cur[cur.length-1].date>SUG_GAP||p.date-cur[0].date>SUG_SPAN))flush();cur.push(p)}
  flush();
  const dis=new Set(sugDis());
  return out.filter(c=>!dis.has(c[0].id)).reverse();
}
function sugName(a,b){

  try{return cap(new Date(a).toDateString()===new Date(b).toDateString()?f.format(a):f.formatRange(a,b))}catch(_){return cap(f.format(a))}
}

/* Verrouillage par code (4 chiffres) */
const LOCK_AFTER=60000;
let lockRec=null,lockOn=false,lockMode="unlock",lockBuf="",lockTmp="",lockMsg="",lockBooted=false,lockFails=0,lockSure=false,hidAt=0;
const bytesHex=a=>[...a].map(b=>b.toString(16).padStart(2,"0")).join("");
async function hashPin(pin,salt){
  try{return bytesHex(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin))))}
  catch(_){let h=5381;const t=salt+":"+pin;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return "x"+(h>>>0).toString(16)}
}
const newSalt=()=>{try{return bytesHex(crypto.getRandomValues(new Uint8Array(16)))}catch(_){return uid()+uid()}};
const lockWait=()=>{try{return Math.max(0,(+localStorage.getItem("pm-lockuntil")||0)-Date.now())}catch(_){return 0}};
const waitMsg=()=>{const n=Math.ceil(lockWait()/1000);return T5(`Trop d’essais. Réessaie dans ${n} s.`,`Too many attempts. Try again in ${n} s.`,`Demasiados intentos. Inténtalo de nuevo en ${n} s.`,`Zu viele Versuche. Versuche es in ${n} s erneut.`,`Troppi tentativi. Riprova tra ${n} s.`)};
function lockShow(mode){
  lockMode=mode;lockBuf="";lockTmp="";lockMsg="";lockSure=false;lockOn=true;
  if(mode==="unlock"){sheet("");$("#pop").hidden=true}
  lockDraw();$("#lock").hidden=false;
}
function lockHide(){lockOn=false;$("#lock").hidden=true}
function lockDraw(){
  const el=$("#lock");
  if(lockMode==="forgot"){
    el.innerHTML=`<h2>${T5("Code oublié ?","Forgot your code?","¿Olvidaste el código?","Code vergessen?","Codice dimenticato?")}</h2><p class="mute">${T5("Le code ne peut pas être récupéré. En dernier recours, tu peux réinitialiser LittleMoments : photos, albums, notes et code seront effacés de l’appli (tes photos d’origine restent dans la galerie du téléphone, tu pourras les réimporter).","The code can’t be recovered. As a last resort, you can reset LittleMoments: photos, albums, notes and the code will be erased from the app (your original photos stay in your phone’s gallery, so you can import them again).","El código no se puede recuperar. Como último recurso, puedes restablecer LittleMoments: se borrarán fotos, álbumes, notas y el código de la app (tus fotos originales siguen en la galería del teléfono y podrás importarlas de nuevo).","Der Code lässt sich nicht wiederherstellen. Als letzte Möglichkeit kannst du LittleMoments zurücksetzen: Fotos, Alben, Notizen und der Code werden aus der App gelöscht (deine Originalfotos bleiben in der Galerie deines Handys und lassen sich erneut importieren).","Il codice non può essere recuperato. Come ultima risorsa puoi reimpostare LittleMoments: foto, album, note e codice verranno cancellati dall’app (le foto originali restano nella galleria del telefono e potrai reimportarle).")}</p><button class="btn dng" data-lk="wipe">${lockSure?T5("Oui, tout effacer","Yes, erase everything","Sí, borrar todo","Ja, alles löschen","Sì, cancella tutto"):T5("Réinitialiser LittleMoments","Reset LittleMoments","Restablecer LittleMoments","LittleMoments zurücksetzen","Reimposta LittleMoments")}</button><button class="lnk" data-lk="back">${T5("Retour","Back","Atrás","Zurück","Indietro")}</button>`;
    return;
  }
  const titles={unlock:T5("Entre ton code","Enter your code","Introduce tu código","Gib deinen Code ein","Inserisci il codice"),set1:T5("Choisis un code à 4 chiffres","Choose a 4-digit code","Elige un código de 4 dígitos","Wähle einen 4-stelligen Code","Scegli un codice a 4 cifre"),set2:T5("Confirme le code","Confirm the code","Confirma el código","Bestätige den Code","Conferma il codice")};
  const title=titles[lockMode]||T5("Entre ton code actuel","Enter your current code","Introduce tu código actual","Gib deinen aktuellen Code ein","Inserisci il codice attuale");
  const dots=[0,1,2,3].map(i=>`<i class="${i<lockBuf.length?"on":""}"></i>`).join("");
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k===""?"<span></span>":`<button type="button" data-lk="${k}" aria-label="${k==="⌫"?T5("Effacer","Delete","Borrar","Löschen","Cancella"):k}">${k}</button>`).join("");
  const extra=lockMode==="unlock"?`<button class="lnk" data-lk="forgot">${T5("Code oublié ?","Forgot your code?","¿Olvidaste el código?","Code vergessen?","Codice dimenticato?")}</button>`:`<button class="lnk" data-lk="cancel">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`;
  el.innerHTML=`<h2>${title}</h2><div class="dots" aria-hidden="true">${dots}</div><p class="msg" role="alert">${esc(lockMsg)}</p><div class="pad">${keys}</div>${extra}`;
}
async function lockWipe(){
  try{(await DB).close()}catch(_){}
  try{await new Promise(r=>{const q=indexedDB.deleteDatabase("petits-moments");q.onsuccess=q.onerror=q.onblocked=()=>r()})}catch(_){}
  try{Object.keys(localStorage).filter(k=>k.startsWith("pm-")).forEach(k=>localStorage.removeItem(k))}catch(_){}
  try{location.reload()}catch(_){}
}
async function lockKey(k){
  if(!lockOn)return;
  if(k==="cancel"){lockHide();return}
  if(k==="forgot"){lockMode="forgot";lockSure=false;lockDraw();return}
  if(k==="back"){lockMode="unlock";lockDraw();return}
  if(k==="wipe"){if(!lockSure){lockSure=true;lockDraw()}else await lockWipe();return}
  if(lockMode==="forgot")return;
  if(k==="⌫"){lockBuf=lockBuf.slice(0,-1);lockDraw();return}
  if(lockBuf.length>=4)return;
  const checking=lockMode!=="set1"&&lockMode!=="set2";
  if(checking&&lockWait()>0){lockMsg=waitMsg();lockDraw();return}
  if(!lockBuf)lockMsg="";
  lockBuf+=k;lockDraw();
  if(lockBuf.length<4)return;
  const pin=lockBuf;lockBuf="";
  if(lockMode==="set1"){lockTmp=pin;lockMode="set2";lockDraw();return}
  if(lockMode==="set2"){
    if(pin!==lockTmp){lockMode="set1";lockTmp="";lockMsg=T5("Les codes ne correspondent pas. Recommence.","The codes don’t match. Try again.","Los códigos no coinciden. Inténtalo de nuevo.","Die Codes stimmen nicht überein. Versuche es erneut.","I codici non corrispondono. Riprova.");lockDraw();return}
    const salt=newSalt();lockRec={id:"lock",salt,hash:await hashPin(pin,salt)};
    if(persist)await put("meta",lockRec).catch(()=>{});
    lockHide();toast(T5("Code enregistré","Code saved","Código guardado","Code gespeichert","Codice salvato"));setTimeout(()=>toast(""),3000);return;
  }
  const ok=!!lockRec&&(await hashPin(pin,lockRec.salt))===lockRec.hash;
  if(!ok){
    lockFails++;
    if(lockFails>=5){lockFails=0;try{localStorage.setItem("pm-lockuntil",String(Date.now()+30000))}catch(_){}lockMsg=waitMsg()}
    else lockMsg=T5("Code incorrect.","Wrong code.","Código incorrecto.","Falscher Code.","Codice errato.");
    lockDraw();return;
  }
  lockFails=0;
  if(lockMode==="unlock"){lockHide();if(!lockBooted){lockBooted=true;render()}return}
  if(lockMode==="verify-change"){lockMode="set1";lockMsg="";lockDraw();return}
  if(lockMode==="verify-off"){
    lockRec=null;if(persist)await del("meta","lock").catch(()=>{});
    lockHide();toast(T5("Verrouillage désactivé","Lock turned off","Bloqueo desactivado","Sperre deaktiviert","Blocco disattivato"));setTimeout(()=>toast(""),3000);
  }
}

  if(!persist){toast(T5("Indisponible : le stockage de l’appareil n’est pas accessible.","Unavailable: device storage isn’t accessible.","No disponible: el almacenamiento del dispositivo no es accesible.","Nicht verfügbar: Der Gerätespeicher ist nicht erreichbar.","Non disponibile: l’archivio del dispositivo non è accessibile."));setTimeout(()=>toast(""),3500);return}

/* Recherche : photos (notes, dates, albums, enfants), albums et notes */
let lastQ="",fromSearch=false,sT=null,dfmt=null,resIds=[];
const hayC=new Map();
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function hay(p){
  let h=hayC.get(p.id);if(h!==undefined)return h;
  const d=new Date(p.date);let loc="";
  try{dfmt=dfmt||new Intl.DateTimeFormat(lang,{day:"numeric",month:"long",year:"numeric"});loc=dfmt.format(d)}catch(_){}
  const ds=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
  const al=albums.filter(a=>a.ids.includes(p.id)).map(apath).join(" ");
  const kd=(p.kids||[]).map(i=>{const k=kidOf(i);return k?k.n+" "+ageAt(k.b,p.date):""}).join(" ");
  h=norm([p.note,p.name,dayLabel(p.date),loc,ds,al,kd,(p.tags||[]).join(" ")].join(" "));
  hayC.set(p.id,h);return h;
}
function searchRun(qv){
  lastQ=qv;const el=$("#sres");if(!el)return;
  const full=norm(qv).trim(),tk=full.split(/\s+/).filter(Boolean);

  const ok=h=>h.includes(full)||tk.every(t=>h.includes(t));
  const als=albums.filter(a=>ok(norm(apath(a))));
  const nts=albums.flatMap(a=>(a.docs||[]).filter(d=>ok(norm((d.title||"")+" "+(d.text||"")))).map(d=>({a,d})));
  const ps=photos.filter(p=>ok(hay(p))).sort((x,y)=>y.date-x.date);
  resIds=shown=ps.map(p=>p.id);
  const sec=(n,w,b)=>`<p class="mute" style="margin:16px 0 2px;font-weight:700">${plural(n,w)}</p>${b}`;
  let h="";
  if(als.length)h+=sec(als.length,"album",als.map(a=>`<button class="item" data-act="sopenal" data-id="${a.id}"><span>${esc(apath(a))}</span><span class="mute">${plural(albumPhotos(a).length,"photo")}</span></button>`).join(""));
  if(nts.length)h+=sec(nts.length,"note",nts.map(({a,d})=>`<button class="item" data-act="sopendoc" data-id="${d.id}" data-a="${a.id}"><span>${esc(d.title||(d.text||"").slice(0,40)||T5("Sans titre","Untitled","Sin título","Ohne Titel","Senza titolo"))}</span><span class="mute">${esc(a.name)}</span></button>`).join(""));
  if(ps.length){
    const M2=150;
    h+=sec(ps.length,"photo",`<div class="grid">${ps.slice(0,M2).map(thumb).join("")}</div>`+(ps.length>M2?`<p class="mute">${T5(`Seules les ${M2} premières photos sont affichées ; précise ta recherche.`,`Only the first ${M2} photos are shown; refine your search.`,`Solo se muestran las primeras ${M2} fotos; afina la búsqueda.`,`Nur die ersten ${M2} Fotos werden angezeigt; verfeinere die Suche.`,`Vengono mostrate solo le prime ${M2} foto; affina la ricerca.`)}</p>`:""));
  }
  el.innerHTML=h||`<p class="mute">${T5("Aucun résultat.","No results.","Sin resultados.","Keine Ergebnisse.","Nessun risultato.")}</p>`;
}

function dateSheet(){

  const d=new Date(ps[0].date),v=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,n=ps.length;
  sheet(`<h3>${T5("Modifier la date","Change date","Cambiar fecha","Datum ändern","Modifica data")}</h3><p class="mute">${n>1?T5(`La date sera appliquée aux ${n} photos ; chaque photo garde son heure.`,`The date will apply to all ${n} photos; each keeps its time.`,`La fecha se aplicará a las ${n} fotos; cada una conserva su hora.`,`Das Datum gilt für alle ${n} Fotos; jedes behält seine Uhrzeit.`,`La data verrà applicata a tutte le ${n} foto; ognuna mantiene l’orario.`):T5("Date de prise de vue de la photo.","Date the photo was taken.","Fecha en que se tomó la foto.","Aufnahmedatum des Fotos.","Data di scatto della foto.")}</p><label>${T5("Date","Date","Fecha","Datum","Data")}<input id="dt" type="date" max="${new Date().toISOString().slice(0,10)}" value="${v}"></label><p id="derr" class="hint dng"></p><button class="btn wide" data-act="datesave">${T5("Enregistrer","Save","Guardar","Speichern","Salva")}</button><button class="lnk wide" data-act="dateno">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`);
}
async function dateSave(){
  const v=$("#dt").value||"",m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m||v>new Date().toISOString().slice(0,10)){$("#derr").textContent=T5("Choisis une date valide (pas dans le futur).","Pick a valid date (not in the future).","Elige una fecha válida (no futura).","Wähle ein gültiges Datum (nicht in der Zukunft).","Scegli una data valida (non futura).");return}
  for(const i of dateT){
    const p=photos.find(x=>x.id===i);if(!p)continue;
    const o=new Date(p.date),nd=new Date(+m[1],+m[2]-1,+m[3],o.getHours(),o.getMinutes(),o.getSeconds(),o.getMilliseconds()).getTime();
    const chg=nd!==p.date;if(!chg&&!p.dg)continue;
    const od=chg&&p.od===undefined?p.date:p.od;
    if(persist)await patch("photos",p.id,r=>{r.date=nd;if(od!==undefined)r.od=od;delete r.dg}).catch(()=>{});
    p.date=nd;if(od!==undefined)p.od=od;delete p.dg;
  }
  sheet("");sel.clear();render();
  if(dateBack&&dateT.length)show(Math.max(0,shown.indexOf(dateT[0])));
  dateBack=false;
  toast(T5("Date modifiée","Date changed","Fecha modificada","Datum geändert","Data modificata"));setTimeout(()=>toast(""),3000);
}

/* Enfants : profils et âge sur les photos */
let kidsL=[],kidF="",kidT=[];
const kidOf=id=>kidsL.find(k=>k.id===id);
const saveKids=async()=>{bkTouch();if(persist)await put("meta",{id:"kids",list:kidsL}).catch(()=>{})};
const AU={d:[["jour","jours"],["day","days"],["día","días"],["Tag","Tage"],["giorno","giorni"]],m:[["mois","mois"],["month","months"],["mes","meses"],["Monat","Monate"],["mese","mesi"]],y:[["an","ans"],["year","years"],["año","años"],["Jahr","Jahre"],["anno","anni"]]};
const au=(n,k)=>{const a=AU[k][LI+1]||AU[k][0];return n+" "+a[n>1?1:0]};
function ageAt(b,t){
  const [by,bm,bd]=b.split("-").map(Number),d=new Date(t);
  let y=d.getFullYear()-by,m=d.getMonth()+1-bm,dd=d.getDate()-bd;
  if(dd<0){m--;dd+=new Date(d.getFullYear(),d.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  if(y<0)return "";
  const tm=y*12+m;
  if(!tm)return dd?au(dd,"d"):T5("Naissance","Birth","Nacimiento","Geburt","Nascita");
  if(tm<24)return au(tm,"m");
  return y<6&&m?au(y,"y")+" "+T5("et","and","y","und","e")+" "+au(m,"m"):au(y,"y");
}
const ageHtml=p=>(p.kids||[]).map(i=>{const k=kidOf(i);if(!k)return "";const a=ageAt(k.b,p.date);return a?`<br>${esc(k.n)} · ${a}`:""}).join("");
const kidChips=()=>kidsL.map(k=>`<button class="chip${kidF===k.id?" on":""}" data-act="kidfilter" data-id="${k.id}" aria-pressed="${kidF===k.id}">👶 ${esc(k.n)}</button>`).join("");
const bdLabel=b=>dayLabel(new Date(b+"T12:00:00").getTime());
function kidsSheet(){
  sheet(`<h3>${T5("Enfants","Children","Niños","Kinder","Bambini")}</h3><p class="mute">${T5("Ajoute un enfant avec sa date de naissance : son âge s’affiche sur ses photos et son album est créé automatiquement. Pour lui associer des photos, appui long puis « Enfant ».","Add a child with their date of birth: their age shows on their photos and their album is created automatically. To link photos, long-press then tap “Child”.","Añade un niño con su fecha de nacimiento: su edad aparece en sus fotos y su álbum se crea automáticamente. Para asociar fotos, pulsación larga y «Niño».","Füge ein Kind mit Geburtsdatum hinzu: Sein Alter erscheint auf den Fotos und sein Album wird automatisch angelegt. Zum Zuordnen lange drücken, dann „Kind“.","Aggiungi un bambino con la data di nascita: la sua età appare sulle foto e il suo album viene creato in automatico. Per associare le foto, pressione lunga e «Bambino».")}</p>${kidsL.map(k=>`<button class="item" data-act="kidedit" data-id="${k.id}"><span>${esc(k.n)}</span><span class="mute">${bdLabel(k.b)}</span></button>`).join("")}<button class="btn wide" data-act="kidnew">+ ${T5("Ajouter un enfant","Add a child","Añadir un niño","Kind hinzufügen","Aggiungi un bambino")}</button><button class="lnk wide" data-act="close">${T5("Fermer","Close","Cerrar","Schließen","Chiudi")}</button>`);
}
function kidForm(id){
  const k=kidOf(id)||{n:"",b:""};
  sheet(`<h3>${id?T5("Modifier","Edit","Editar","Bearbeiten","Modifica"):T5("Nouvel enfant","New child","Nuevo niño","Neues Kind","Nuovo bambino")}</h3><label>${T5("Prénom","First name","Nombre","Vorname","Nome")}<input id="kn" type="text" maxlength="60" value="${esc(k.n)}"></label><label>${T5("Date de naissance","Date of birth","Fecha de nacimiento","Geburtsdatum","Data di nascita")}<input id="kb" type="date" max="${new Date().toISOString().slice(0,10)}" value="${k.b}"></label><p id="kerr" class="hint dng"></p><button class="btn wide" data-act="kidsave" data-id="${id}">${T5("Enregistrer","Save","Guardar","Speichern","Salva")}</button>${id?`<button class="btn dng wide" data-act="kiddel" data-id="${id}">${T5("Supprimer","Delete","Eliminar","Löschen","Elimina")}</button>`:""}<button class="lnk wide" data-act="kidsedit">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`);
}
async function kidSave(id){
  const n=($("#kn").value||"").trim().slice(0,60),b=$("#kb").value||"";
  if(!n||!/^\d{4}-\d{2}-\d{2}$/.test(b)||b>new Date().toISOString().slice(0,10)){$("#kerr").textContent=T5("Indique un prénom et une date de naissance valide.","Enter a first name and a valid date of birth.","Indica un nombre y una fecha de nacimiento válida.","Gib einen Vornamen und ein gültiges Geburtsdatum ein.","Inserisci un nome e una data di nascita valida.");return}
  let k=kidOf(id);
  if(k){const old=k.n;k.n=n;k.b=b;const al=albums.find(x=>x.kid===k.id);if(al&&norm(al.name)===norm(old)&&norm(old)!==norm(n)){al.name=n.slice(0,60);await saveA(al)}}
  else{k={id:uid(),n,b};kidsL.push(k)}
  await saveKids();await kidEnsure(k);kidView(k.id);
}
function kidAskDel(id){
  sheet(`<h3>${T5("Supprimer ce profil ?","Delete this profile?","¿Eliminar este perfil?","Profil löschen?","Eliminare questo profilo?")}</h3><p class="mute">${T5("Les photos ne sont pas supprimées, mais elles ne seront plus associées à cet enfant.","Photos are not deleted, but they will no longer be linked to this child.","Las fotos no se eliminan, pero dejarán de estar asociadas a este niño.","Die Fotos werden nicht gelöscht, sind aber nicht mehr diesem Kind zugeordnet.","Le foto non vengono eliminate, ma non saranno più associate a questo bambino.")}</p><button class="btn dng wide" data-act="kiddelok" data-id="${id}">${T5("Supprimer","Delete","Eliminar","Löschen","Elimina")}</button><button class="lnk wide" data-act="kidedit" data-id="${id}">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`);
}
async function kidDel(id){
  kidsL=kidsL.filter(k=>k.id!==id);if(kidF===id)kidF="";
  for(const p of photos)if((p.kids||[]).includes(id)){
    const nk=p.kids.filter(x=>x!==id);if(nk.length)p.kids=nk;else delete p.kids;
    if(persist)await patch("photos",p.id,r=>{if(nk.length)r.kids=nk;else delete r.kids}).catch(()=>{});
  }
  for(const a of albums)if(a.kid===id){delete a.kid;await saveA(a)}
  await saveKids();kidsSheet();
}
function kidSheet(){
  if(!kidsL.length){kidsSheet();return}
  const ps=kidT.map(i=>photos.find(x=>x.id===i)).filter(Boolean);
  sheet(`<h3>${T5("Qui est sur la photo ?","Who is in the photo?","¿Quién sale en la foto?","Wer ist auf dem Foto?","Chi c’è nella foto?")}</h3>${kidsL.map(k=>`<button class="item" data-act="kidset" data-id="${k.id}"><span>${esc(k.n)}</span><span class="mute">${ps.length&&ps.every(p=>(p.kids||[]).includes(k.id))?"✓":""}</span></button>`).join("")}<button class="btn wide" data-act="kiddone">${T5("Terminé","Done","Listo","Fertig","Fatto")}</button><button class="lnk wide" data-act="kidsedit">${T5("Gérer les enfants","Manage children","Gestionar niños","Kinder verwalten","Gestisci bambini")}</button>`);
}
async function kidSet(id){
  const ps=kidT.map(i=>photos.find(x=>x.id===i)).filter(Boolean);if(!ps.length)return;
  const on=!ps.every(p=>(p.kids||[]).includes(id));
  for(const p of ps){
    const nk=on?[...new Set([...(p.kids||[]),id])]:(p.kids||[]).filter(x=>x!==id);
    try{if(persist)await patch("photos",p.id,r=>{if(nk.length)r.kids=nk;else delete r.kids});if(nk.length)p.kids=nk;else delete p.kids}catch(_){}
  }
  kidSheet();
}

/* Corbeille : les éléments supprimés restent 30 jours */
const TRASH_DAYS=30,DAY=864e5;
let trash=[],trashN=0,tUrls=[];
const T5=(...a)=>a[LI+1]||a[0];
const TKEEP=()=>T5("Récupérable pendant 30 jours dans Paramètres › Corbeille.","Recoverable for 30 days in Settings › Trash.","Recuperable durante 30 días en Ajustes › Papelera.","30 Tage lang wiederherstellbar unter Einstellungen › Papierkorb.","Recuperabile per 30 giorni in Impostazioni › Cestino.");
async function trashAdd(it){it.tid=uid();it.at=Date.now();trash.push(it);trashN=trash.length;if(persist)await put("trash",it).catch(()=>{})}
async function trashPhoto(p,inAlb){let rec=p;if(persist){try{rec=(await getOne("photos",p.id))||p}catch(_){}}await trashAdd({kind:"photo",photo:rec,inAlb:inAlb||[]})}
async function trashAlbums(rm,root){await trashAdd({kind:"album",albums:rm,root})}
async function trashLoad(){
  if(!persist)return;
  trash=await all("trash");
  const lim=Date.now()-TRASH_DAYS*DAY;
  for(const x of trash.filter(x=>x.at<lim))await del("trash",x.tid).catch(()=>{});
  trash=trash.filter(x=>x.at>=lim);trashN=trash.length;
}
async function trashPurge(tids){
  const s=new Set(tids);
  trash=trash.filter(x=>!s.has(x.tid));trashN=trash.length;
  if(persist)for(const k of tids)await del("trash",k).catch(()=>{});
}
async function trashRestore(tid){
  const it=trash.find(x=>x.tid===tid);if(!it)return;
  if(it.kind==="photo"){
    const p=it.photo;
    if(!photos.some(x=>x.id===p.id)){if(persist)await put("photos",p).catch(()=>{});urls.delete(p.id);furls.delete(p.id);photos.push(p)}
    for(const x of it.inAlb||[]){
      const al=albums.find(a=>a.id===x.a);if(!al)continue;
      if(!al.ids.includes(p.id))al.ids.splice(Math.min(x.i,al.ids.length),0,p.id);
      if(x.c)al.cover=p.id;
      await saveA(al);
    }
  }else if(it.kind==="album"){
    const have=new Set(albums.map(x=>x.id));
    for(const al of it.albums){
      if(have.has(al.id))continue;
      if(al.id===it.root&&al.parent&&!have.has(al.parent))delete al.parent;
      albums.push(al);syncDocs(al);
    }
    albums.sort((x,y)=>ct(x)-ct(y));
    albums.forEach((x,k)=>{x.pos=k});
    for(const x of albums)await saveA(x);
  }else{
    const al=albums.find(a=>a.id===it.a);
    if(!al){toast(T5("Restaurez d’abord l’album d’origine.","Restore the original album first.","Restaura primero el álbum original.","Stelle zuerst das ursprüngliche Album wieder her.","Ripristina prima l’album originale."));setTimeout(()=>toast(""),3500);return}
    const d=it.doc;
    if(!(al.docs||[]).some(x=>x.id===d.id))al.docs=[...(al.docs||[]),d];
    if(!al.ids.includes(d.id))al.ids.splice(it.i<0?al.ids.length:Math.min(it.i,al.ids.length),0,d.id);
    await saveA(al);
  }
  await trashPurge([tid]);
  trashSheet();
  toast(T5("Élément restauré","Item restored","Elemento restaurado","Element wiederhergestellt","Elemento ripristinato"));setTimeout(()=>toast(""),3000);
}
function trashSheet(){
  tUrls.forEach(u=>URL.revokeObjectURL(u));tUrls=[];
  const now=Date.now(),L=[...trash].sort((x,y)=>y.at-x.at);
  const when=it=>{const n=Math.max(1,Math.ceil((it.at+TRASH_DAYS*DAY-now)/DAY)),m=n>1;return T5(`${n} jour${m?"s":""} restant${m?"s":""}`,`${n} day${m?"s":""} left`,`${n} día${m?"s":""} restante${m?"s":""}`,`noch ${n} Tag${m?"e":""}`,`${n} giorn${m?"i":"o"} rimast${m?"i":"o"}`)};
  const box="width:56px;height:56px;border-radius:10px;flex:0 0 auto";
  const th=it=>{
    if(it.kind==="photo"&&it.photo&&it.photo.blob){const u=URL.createObjectURL(it.photo.blob);tUrls.push(u);return `<img src="${u}" alt="" style="${box};object-fit:cover">`}
    return `<div style="${box};display:flex;align-items:center;justify-content:center;background:var(--line);font-size:24px">${it.kind==="album"?"📁":"📝"}</div>`;
  };
  const info=it=>{
    if(it.kind==="photo")return [esc(dayLabel(it.photo.date)),T5("Photo","Photo","Foto","Foto","Foto")];
    if(it.kind==="album"){const r=it.albums.find(x=>x.id===it.root)||it.albums[0],k=it.albums.length-1;return [esc(r.name),T5("Album","Album","Álbum","Album","Album")+(k?" · "+plural(k,"sous-album"):"")]}
    return [esc(it.doc.title||T5("Sans titre","Untitled","Sin título","Ohne Titel","Senza titolo")),T5("Note","Note","Nota","Notiz","Nota")];
  };
  const row=it=>{const [ti,ki]=info(it);return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">${th(it)}<div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ti}</b><span class="mute" style="font-size:12px">${ki} · ${when(it)}</span></div><button class="btn" data-act="trrest" data-id="${it.tid}">${T5("Restaurer","Restore","Restaurar","Wiederherstellen","Ripristina")}</button><button class="lnk" style="color:var(--danger)" data-act="trdel" data-id="${it.tid}" aria-label="${T5("Supprimer définitivement","Delete permanently","Eliminar definitivamente","Endgültig löschen","Elimina definitivamente")}">✕</button></div>`};
  sheet(`<h3>${T5("Corbeille","Trash","Papelera","Papierkorb","Cestino")}</h3><p class="mute">${T5("Les éléments supprimés sont conservés 30 jours, puis effacés définitivement.","Deleted items are kept for 30 days, then erased for good.","Los elementos eliminados se conservan 30 días y luego se borran definitivamente.","Gelöschte Elemente bleiben 30 Tage erhalten und werden dann endgültig gelöscht.","Gli elementi eliminati restano 30 giorni, poi vengono cancellati definitivamente.")}</p>${L.length?L.map(row).join(""):`<p class="mute" style="padding:18px 0;text-align:center">${T5("La corbeille est vide.","The trash is empty.","La papelera está vacía.","Der Papierkorb ist leer.","Il cestino è vuoto.")}</p>`}${L.length?`<button class="btn dng wide" data-act="trempty">${T5("Vider la corbeille","Empty trash","Vaciar la papelera","Papierkorb leeren","Svuota il cestino")}</button>`:""}<button class="lnk wide" data-act="gmenu">‹ ${T5("Paramètres","Settings","Ajustes","Einstellungen","Impostazioni")}</button>`);
}
function trashAskDel(id){
  sheet(`<h3>${T5("Supprimer définitivement ?","Delete permanently?","¿Eliminar definitivamente?","Endgültig löschen?","Eliminare definitivamente?")}</h3><p class="mute">${T5("Cet élément ne pourra plus être récupéré.","This item can no longer be recovered.","Este elemento ya no se podrá recuperar.","Dieses Element kann nicht wiederhergestellt werden.","Questo elemento non potrà più essere recuperato.")}</p><button class="btn dng wide" data-act="trdelok" data-id="${id}">${T5("Supprimer définitivement","Delete permanently","Eliminar definitivamente","Endgültig löschen","Elimina definitivamente")}</button><button class="lnk wide" data-act="trash">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`);
}
function trashAskEmpty(){
  sheet(`<h3>${T5("Vider la corbeille ?","Empty the trash?","¿Vaciar la papelera?","Papierkorb leeren?","Svuotare il cestino?")}</h3><p class="mute">${T5("Tout sera effacé définitivement, sans retour possible.","Everything will be erased for good, with no way back.","Todo se borrará definitivamente, sin posibilidad de recuperarlo.","Alles wird endgültig gelöscht und kann nicht wiederhergestellt werden.","Tutto verrà cancellato definitivamente, senza possibilità di recupero.")}</p><button class="btn dng wide" data-act="tremptyok">${T5("Vider la corbeille","Empty trash","Vaciar la papelera","Papierkorb leeren","Svuota il cestino")}</button><button class="lnk wide" data-act="trash">${T5("Annuler","Cancel","Cancelar","Abbrechen","Annulla")}</button>`);
}

(async()=>{
  try{photos=await all("photos");albums=await all("albums");albums.sort((x,y)=>ct(x)-ct(y));albums.forEach(syncDocs)}
  catch(_){persist=false;toast("Stockage indisponible : les photos ne seront pas conservées à la fermeture.")}
  try{await trashLoad()}catch(_){}
  try{if(persist){const m=await getOne("meta","kids");kidsL=(m&&m.list)||[]}}catch(_){}
  try{for(const k of kidsL)await kidEnsure(k)}catch(_){}
  try{if(persist)lockRec=(await getOne("meta","lock"))||null}catch(_){}
  try{if(persist){const m=await getOne("meta","jalons");jalC=(m&&m.list)||[]}}catch(_){}
  try{const o=localStorage.getItem("pm-open");if(o){localStorage.removeItem("pm-open");if(albums.some(x=>x.id===o))view="album:"+o}}catch(_){}
  try{navigator.storage.persist().catch(()=>{})}catch(_){}
  storageRefresh();
  if(typeof claude!=="undefined"&&claude.use)claude.use("downloads").then(x=>{dl=x}).catch(()=>{});
  else dl={save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/i.test(filename)?"application/json":"application/octet-stream"});
    const C=window.Capacitor,P=C&&C.Plugins;
    if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
      /* Appli Android : on écrit le fichier puis on ouvre le menu de partage (Enregistrer dans Drive, Fichiers, WhatsApp…) */
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
      const w=await P.Filesystem.writeFile({path:filename,data:b64,directory:"CACHE"});
      try{await P.Share.share({title:filename,url:w.uri,dialogTitle:"Enregistrer ou envoyer"})}
      catch(e){if(e&&/cancel/i.test(String(e.message||e)))throw {code:"declined"};throw e}
      return;
    }
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=filename;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
  }};
  if(lockRec)lockShow("unlock");else{lockBooted=true;render()}
})();
</script>
